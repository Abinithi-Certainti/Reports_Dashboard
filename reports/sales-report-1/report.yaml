# Sales Report 1 - spec for the report engine (AG-79). Source of truth: extracts/sales-report-1/01_model.md
id: sales-report-1
title: Sales Report
subtitle: Daily sales, transactions, labour and SPLH - against the same days last year
dataset: dataset.sql
calendar: retail   # needed for last year: the same weekday of the same retail week, one retail year earlier

dimensions:
  day:               { label: Date,              column: day, type: date }
  weekday:           { label: Weekday,           column: weekday, sort_by: weekday_no }
  week_end:          { label: End of Week,       column: week_end, type: date }
  plaza:             { label: Plaza,             column: plaza }
  brand:             { label: Brand,             column: brand }
  district_director: { label: District Director, column: district_director }
  agm:               { label: AGM,               column: agm }

# For each measure: PY = the selected days one retail year earlier, YOY = value - PY (a missing PY counts as 0, as
# in Power BI), YOY % = (value - PY) / PY. The labels follow the old report.
measures:
  sales:                 { label: Sales, sql: "sum(sales)", format: currency }
  transactions:          { label: Transactions, sql: "sum(transactions)", format: number }
  labour:                { label: Labour Hours Direct, sql: "sum(labour_hours)", format: number }
  splh:                  { label: SPLH, sql: "sum(sales) / nullif(sum(labour_hours), 0)", format: currency }
  avg_check:             { label: Average Check, sql: "sum(sales) / nullif(sum(transactions), 0)", format: currency }
  sales_py:              { label: Sales PY, of: sales, window: py, format: currency }
  sales_yoy:             { label: Sales YOY $, of: sales, window: yoy, format: currency }
  sales_yoy_pct:         { label: Sales YOY %, of: sales, window: yoy_pct, format: percent }
  transactions_py:       { label: Transactions PY, of: transactions, window: py, format: number }
  transactions_yoy:      { label: Transactions YOY, of: transactions, window: yoy, format: number }
  transactions_yoy_pct:  { label: Transactions YOY %, of: transactions, window: yoy_pct, format: percent }
  labour_py:             { label: Labour Hours Direct PY, of: labour, window: py, format: number }
  labour_yoy:            { label: Labour Hours Direct YOY, of: labour, window: yoy, format: number }
  labour_yoy_pct:        { label: Labour Hours Direct YOY %, of: labour, window: yoy_pct, format: percent }
  splh_py:               { label: SPLH PY, of: splh, window: py, format: currency }
  splh_yoy:              { label: SPLH YOY $, of: splh, window: yoy, format: currency }
  splh_yoy_pct:          { label: SPLH YOY %, of: splh, window: yoy_pct, format: percent }
  avg_check_py:          { label: Average Check PY, of: avg_check, window: py, format: currency }
  avg_check_yoy:         { label: Average Check YOY $, of: avg_check, window: yoy, format: currency }
  avg_check_yoy_pct:     { label: Average Check YOY %, of: avg_check, window: yoy_pct, format: percent }

filters:
  - { dimension: district_director, type: multi_select }
  - { dimension: agm,               type: multi_select }
  - { dimension: plaza,             type: multi_select }
  - { dimension: brand,             type: multi_select }
  - { dimension: day,               type: date_range, default_last_days: 16 }

visuals:
  - type: kpi
    items:
      - { label: Sales,              measure: sales,          icon: total }
      - { label: Sales YOY %,        measure: sales_yoy_pct,  icon: trend }
      - { label: Transactions,       measure: transactions,   icon: count }
      - { label: Labour hours direct, measure: labour,        icon: store }
      - { label: SPLH,               measure: splh,           icon: cash }
  - type: table
    title: Daily Sales - Total Road (by weekday)
    rows: [weekday]
    values: [sales, sales_py, sales_yoy, sales_yoy_pct, transactions, transactions_py, transactions_yoy_pct, avg_check, avg_check_py, avg_check_yoy_pct]
    total_row: true
    span: 12
  - type: table
    title: Labour and SPLH (by weekday)
    rows: [weekday]
    values: [labour, labour_py, labour_yoy, labour_yoy_pct, splh, splh_py, splh_yoy, splh_yoy_pct]
    total_row: true
    span: 12
  - type: matrix
    title: Sales by Plaza and Brand
    rows: [plaza, brand]
    columns: [day]
    values: [sales]
    span: 12
  - type: matrix
    title: Sales by Brand
    rows: [brand]
    columns: [day]
    values: [sales]
    span: 12
  - type: table
    title: Sales and transactions YOY % (by week)
    rows: [week_end]
    values: [sales, sales_py, sales_yoy_pct, transactions, transactions_yoy_pct]
    total_row: true
    span: 6
  - type: table
    title: Sales and labour YOY % (by plaza)
    rows: [plaza]
    values: [sales, sales_yoy_pct, labour, labour_yoy_pct, splh]
    total_row: true
    span: 6
  - type: matrix
    title: Labour Hours Direct by Plaza
    rows: [plaza, brand]
    columns: [day]
    values: [labour]
    span: 12
