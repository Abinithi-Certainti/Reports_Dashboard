# Tender Report - spec for the report engine.
# Source of truth for the old report: db/seeds/001_tender_report.sql and extracts/tender-report/.
# Data: DEV (dataset.sql, netsuite_location_mapping + district_directors). The QA-only version is dataset.qa.sql
id: tender-report
title: Tender Report
subtitle: Tenders by payment type, store and day
dataset: dataset.sql

dimensions:
  plaza:             { label: Plaza,             column: plaza }
  district_director: { label: District Director, column: district_director }
  brand:             { label: Brand,             column: brand }
  payment_type:      { label: Payment Type,      column: payment_type, sort_by: sequence }
  end_day:           { label: Date,              column: end_day, type: date }

measures:
  tender_amount: { label: Tender amount, sql: "sum(tender_amount) - sum(paidout_amount)", format: currency }  # old "Tender amount 2"
  gross_tenders: { label: Tenders,       sql: "sum(tender_amount)",                        format: currency }
  paidouts:      { label: Paid-outs,     sql: "sum(paidout_amount)",                       format: currency }

filters:
  - { dimension: plaza,             type: multi_select }
  - { dimension: district_director, type: multi_select }
  - { dimension: brand,             type: multi_select }
  - { dimension: payment_type,      type: multi_select }
  - { dimension: end_day,           type: date_range, default_last_days: 36500 }   # opens on all loaded days (decided 2026-09-29); the range stops at the first loaded day

visuals:
  - type: kpi
    items:
      - { label: Total tender amount,     measure: tender_amount, icon: total }
      - { label: Cash (after paid-outs),  measure: tender_amount, include: { payment_type: [Cash] }, icon: cash }
      - { label: Card and other,          measure: tender_amount, exclude: { payment_type: [Cash] }, icon: card }
      - { label: Paid-outs,               measure: paidouts, good_direction: down, icon: paidout }
  - type: line
    title: Daily tender amount
    rows: [end_day]
    values: [tender_amount]
    span: 8
  - type: donut
    title: Share by brand
    rows: [brand]
    values: [tender_amount]
    span: 4
  - type: table
    title: Selected Locations - Summary
    rows: [payment_type]
    values: [tender_amount]
    total_row: true
  - type: bar
    title: Tender amount by payment type
    rows: [payment_type]
    values: [tender_amount]
  - type: donut
    title: Payment mix
    rows: [payment_type]
    values: [tender_amount]
    limit: 5            # the 5 largest payment types, the rest added up as "Other"
    span: 6
  - type: split
    title: Cash vs card and other
    rows: [payment_type]
    values: [tender_amount]
    highlight: [Cash]
    span: 6
  - type: leaderboard
    title: Top stores
    rows: [plaza, brand]
    values: [tender_amount, paidouts]
    limit: 8
  - type: matrix
    title: All Locations - Detail
    rows: [plaza, brand, payment_type]
    columns: [end_day]
    values: [tender_amount]
